name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Analyse & Tests (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - name: Dependencies holen
        run: flutter pub get
      - name: Unit- & Widget-Tests
        run: flutter test --coverage

  build_apk_and_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build APK & Release
    runs-on: ubuntu-latest
    needs: analyze_and_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - name: Dependencies holen
        run: flutter pub get
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK (Release)
        run: flutter build apk --release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          name: APK Build ${{ github.run_number }}
          tag_name: apk-build-${{ github.run_number }}
          body: |
            Automatisch generierte APK von Build ${{ github.run_number }}.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
